title: HOSAKA — Operator Manual
description: signal steady. no wrong way.
theme: jekyll-theme-hacker
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
plugins:
  - jekyll-relative-links
  - jekyll-titles-from-headings
relative_links:
  enabled: true
  collections: true
include:
  - docs
defaults:
  - scope:
      path: ""
    values:
      layout: default

# routing
permalink: pretty
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
